name: publish

# Six registries, one tag.
#
# `git tag v1.2.0 && git push --tags` and every library goes out at that
# version. The one thing this must not do is publish five of six: they are
# generated from one contract, and a caller reasonably reads matching versions
# as describing the same api. So `agreed` runs first and refuses the whole run
# if the six numbers are not the tag — and the six publishes then run in
# parallel, because a registry that is down is not a reason to skip the five
# that are up. What partial success needs is to be *visible*, which is what the
# summary at the end is for.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'the version to publish — must match all six manifests'
        required: true

permissions:
  contents: write

jobs:
  # The gate. Six build systems, six places the version lives, and no shared
  # notion of one — see `.github/scripts/versions.ts`.
  agreed:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'
      - id: v
        run: |
          version='${{ inputs.version }}'
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publishing $version"
      - run: bun .github/scripts/versions.ts '${{ steps.v.outputs.version }}'

      # And it is the contract the six were generated from, not a contract
      # somebody edited by hand afterwards. A release is the wrong place to find
      # that out, but it is a much better place than a bug report.
      - run: bun install --frozen-lockfile
      - name: The tag is generated code, not hand-edited code
        run: |
          bun run generate
          if ! git diff --quiet; then
            echo '::error::the committed clients disagree with openapi.json at this tag. Do not publish this.'
            git --no-pager diff --stat
            exit 1
          fi

  npm:
    needs: [agreed]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: bun install --frozen-lockfile
      # `npm publish` and not `bun publish`: npm is what reads `NODE_AUTH_TOKEN`
      # the way `setup-node` writes it, and `prepublishOnly` runs the build.
      - run: npm publish --access public
        working-directory: packages/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    needs: [agreed]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install hatchling twine
      - run: python -m hatchling build
        working-directory: packages/python
      # `check` first: PyPI rejects a long_description it cannot render, and it
      # does so after the upload has started.
      - run: |
          twine check dist/*
          twine upload dist/*
        working-directory: packages/python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  crates:
    needs: [agreed]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # `--locked` so what is published builds against the versions that were
      # tested, and a dry run first because a crates.io publish cannot be undone
      # — a yank leaves the version taken for ever.
      - run: cargo publish --locked --dry-run
        working-directory: packages/rust
      - run: cargo publish --locked
        working-directory: packages/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  maven:
    needs: [agreed]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Central will not take an unsigned artifact, and `build.gradle.kts` only
      # configures signing when both of these are set — so a missing key here is
      # an unsigned upload that Central refuses at the end rather than a failure
      # at the start.
      - name: A signing key, or nothing
        env:
          KEY: ${{ secrets.MAVEN_GPG_KEY }}
          PASSWORD: ${{ secrets.MAVEN_GPG_PASSWORD }}
        run: |
          if [ -z "$KEY" ] || [ -z "$PASSWORD" ]; then
            echo '::error::MAVEN_GPG_KEY and MAVEN_GPG_PASSWORD are not both set. Maven Central refuses an unsigned artifact, and build.gradle.kts skips signing silently without them.'
            exit 1
          fi
      - run: ./gradlew publishMavenPublicationToCentralRepository --console=plain --no-daemon
        working-directory: packages/kotlin
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSWORD: ${{ secrets.MAVEN_GPG_PASSWORD }}
      # The staging repository is uploaded, not released: Central's own step. A
      # publish that auto-released would make a mistake permanent in a place
      # where nothing can be deleted.
      - run: echo '::notice::uploaded to the Central staging repository — release it at https://central.sonatype.com/publishing'

  nuget:
    needs: [agreed]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet pack src/Acyka -c Release --nologo -o out
        working-directory: packages/csharp
      # `--skip-duplicate` so a re-run after a half-finished release is not a
      # failure: the version is already there and that is the intended state.
      - run: |
          dotnet nuget push 'out/*.nupkg' \
            --source https://api.nuget.org/v3/index.json \
            --api-key '${{ secrets.NUGET_API_KEY }}' \
            --skip-duplicate
        working-directory: packages/csharp

  # C++ has no registry, so the release *is* the distribution: a tarball of the
  # headers at a url a CMake `FetchContent` can name. Nothing to sign up for and
  # nothing to be rate-limited by, which for a header-only library is most of
  # what a package manager was providing.
  headers:
    needs: [agreed]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: One tarball of the headers
        run: |
          v='${{ needs.agreed.outputs.version }}'
          tar czf "acyka-cpp-$v.tar.gz" -C packages/cpp include CMakeLists.txt README.md
          sha256sum "acyka-cpp-$v.tar.gz" | tee "acyka-cpp-$v.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            acyka-cpp-${{ needs.agreed.outputs.version }}.tar.gz
            acyka-cpp-${{ needs.agreed.outputs.version }}.tar.gz.sha256
          generate_release_notes: true
          # The tag may not exist yet on a workflow_dispatch run, and a release
          # against a tag that is not there is a release nobody can find.
          tag_name: v${{ needs.agreed.outputs.version }}

  # What actually happened, in one place.
  #
  # `if: always()` and reading each job's result rather than depending on them
  # succeeding: five registries up and one down must not read as a failed
  # release, and must not read as a clean one either.
  said:
    needs: [agreed, npm, pypi, crates, maven, nuget, headers]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Who went out
        run: |
          v='${{ needs.agreed.outputs.version }}'
          {
            echo "## acyka $v"
            echo
            echo '| library | registry | |'
            echo '|---|---|---|'
            echo '| typescript | npm | ${{ needs.npm.result }} |'
            echo '| python | PyPI | ${{ needs.pypi.result }} |'
            echo '| rust | crates.io | ${{ needs.crates.result }} |'
            echo '| kotlin | Maven Central (staged) | ${{ needs.maven.result }} |'
            echo '| csharp | NuGet | ${{ needs.nuget.result }} |'
            echo '| cpp | this release | ${{ needs.headers.result }} |'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: And say so out loud if it was partial
        if: contains(needs.*.result, 'failure')
        run: |
          echo '::error::some of the six did not publish. The versions are already taken where they succeeded, so the fix is a patch version rather than a re-run.'
          exit 1
