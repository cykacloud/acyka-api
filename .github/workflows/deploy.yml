name: deploy

# `dev.acyka.cc`. The site is built into an image here and the box is told to
# pull it — the stack it joins is `cykacloud/acyka`'s `compose.yaml`, because
# that is where Caddy, the api it documents and the network they share already
# are. Two repositories, one stack, and the seam is a registry tag.
on:
  push:
    branches: [main]
    # Only what actually reaches the image. The libraries are five separate
    # publishes with their own workflow, and a commit that only touches Rust
    # must not restart the site.
    #
    # `tools/**` and `openapi.json` are on the list because the site is built
    # from both: the reference pages are the contract, read by the same reader
    # the six clients are generated from.
    paths:
      - 'apps/docs/**'
      - 'openapi.json'
      - 'tools/**'
      - '.github/workflows/deploy.yml'
  # How a deploy is forced when a run failed for a reason that had nothing to do
  # with the commit — the box being down, a registry timing out.
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}/docs

jobs:
  image:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      # A builder that outlives the job.
      #
      # On a hosted runner the machine is thrown away and a remote cache is the
      # only one worth having. On our own it is the wrong answer twice over: the
      # layers are on this disk already, and shipping them to GitHub and pulling
      # them back is the slow part.
      - uses: docker/setup-buildx-action@v3
        with:
          name: acyka-docs
          cleanup: false

      # A registry credential this job does not share with anything beside it.
      #
      # `docker login` writes to `~/.docker/config.json` and `login-action`'s
      # post step logs out again. Three runners share this host as one user, so
      # a neighbour finishing takes the credential out from under whatever is
      # still pushing — which fails with `denied: denied` and reads exactly like
      # a permissions problem. `DOCKER_CONFIG` per runner temp is one config per
      # job by construction.
      - name: A docker config of this job's own
        run: |
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/docker"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: The kit is private, so the build needs a key
        env:
          KIT_SSH_KEY: ${{ secrets.KIT_SSH_KEY }}
        run: |
          if [ -z "$KIT_SSH_KEY" ]; then
            echo '::error::KIT_SSH_KEY is not set on this repository. The site is drawn with @cyka/ui, which is the private cykacloud/ui — add a read-only deploy key for it.'
            exit 1
          fi

      # Once, and once more if the first go fell over.
      #
      # The failure this is for is not ours: `oven/bun:1.3-alpine: TLS handshake
      # timeout` resolving a base image off Docker Hub is a thing that happens,
      # and the fix is pressing re-run. A `uses:` step cannot be looped, so this
      # is the native shape of a retry — and a push is idempotent, so a first
      # attempt that got half way costs nothing on the second.
      - uses: docker/build-push-action@v6
        id: build
        continue-on-error: true
        env:
          KIT_SSH_KEY: ${{ secrets.KIT_SSH_KEY }}
        with:
          # The root, not `apps/docs`: the site's loaders reach `openapi.json`
          # and `tools/spec.ts` through the two aliases in `svelte.config.js`,
          # because one reader shared with the six libraries is the point.
          context: .
          file: ./apps/docs/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # `secret-envs` and not `secrets`: the latter reads one `id=value` per
          # line, and a private key is thirty lines — every one of them taken for
          # another secret with no name.
          secret-envs: |
            kit_key=KIT_SSH_KEY
          cache-from: type=registry,ref=${{ env.IMAGE }}:latest

      - uses: docker/build-push-action@v6
        if: steps.build.outcome == 'failure'
        env:
          KIT_SSH_KEY: ${{ secrets.KIT_SSH_KEY }}
        with:
          context: .
          file: ./apps/docs/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          secret-envs: |
            kit_key=KIT_SSH_KEY
          cache-from: type=registry,ref=${{ env.IMAGE }}:latest

      # Buildkit keeps everything it has ever built unless told otherwise, and
      # this builder is not thrown away with the job any more. A ceiling rather
      # than a calendar: `until=168h` throws out what has not been touched in a
      # week, and on a repository that deploys several times a day that is
      # nothing at all. A full disk does not announce itself as a full disk — it
      # shows up as a push that was denied a permission it has.
      - name: Keep the cache from growing for ever
        if: always()
        continue-on-error: true
        run: docker buildx prune --force --max-used-space 4gb --builder acyka-docs

  deploy:
    needs: [image]
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: The three things this needs and cannot invent
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
          KEY: ${{ secrets.SSH_KEY }}
        run: |
          missing=''
          [ -n "$HOST" ] || missing="$missing SSH_HOST"
          [ -n "$USER" ] || missing="$missing SSH_USER"
          [ -n "$KEY" ] || missing="$missing SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::not set on this repository:$missing — the image is built and pushed, but nothing told the server to pull it. They are the same three values cykacloud/acyka deploys with."
            exit 1
          fi

      # The box sits behind a link that drops the occasional connection, and a
      # single dropped keyscan used to fail a whole deploy before it had tried
      # anything.
      - name: Authorise the server
        env:
          HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          for i in 1 2 3; do
            if ssh-keyscan -T 20 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null \
               && [ -s ~/.ssh/known_hosts ]; then
              echo "host key taken on attempt $i"; exit 0
            fi
            echo "keyscan attempt $i found nothing, trying again"; sleep 6
          done
          echo "could not read the host key after three tries" >&2
          exit 1

      # The image is in a private registry and the server is not logged in to
      # it. The token is this job's own and dies with it, and it is logged out
      # again afterwards — a credential nobody meant to leave behind is how one
      # gets left.
      - name: Let the server read the registry
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | ssh "$USER@$HOST" \
            "docker login ghcr.io -u ${{ github.actor }} --password-stdin"

      # Pinned to this commit rather than `latest`, so what runs is what this run
      # built even if another push lands mid-deploy — and so a rollback is this
      # line with an older sha instead of a revert and a wait.
      #
      # `--no-build` on purpose: the server has not got the private kit and must
      # never try. If the pull failed this has to say so rather than start a
      # build it cannot finish.
      #
      # One service named, and that matters: the rest of `compose.yaml` belongs
      # to `cykacloud/acyka` and is mid-flight as far as this run knows.
      - name: Swap it over
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -o ServerAliveInterval=10 "$USER@$HOST" "cd /opt/acyka \
            && export DOCS_IMAGE='${{ env.IMAGE }}:${{ github.sha }}' \
            && docker compose pull docs \
            && docker compose up -d --no-build docs"

      - name: And forget the registry again
        if: always()
        continue-on-error: true
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
        run: ssh "$USER@$HOST" 'docker logout ghcr.io' || true

      # A deploy that reports success while the site answers 502 is worse than
      # one that fails: nobody looks. Five goes, because a Bun process takes a
      # moment to bind and Caddy a moment to notice.
      - name: Ask the site whether it is up
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://dev.acyka.cc/ || echo 000)
            echo "attempt $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 8
          done
          echo '::error::dev.acyka.cc did not answer 200 after five tries'
          exit 1
